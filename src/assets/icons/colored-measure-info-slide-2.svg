<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone back face -->
  <rect x="65" y="22" width="70" height="130" rx="16" fill="#F0EDE8" stroke="#CCC9C3" stroke-width="2"/>
  <!-- Camera island -->
  <rect x="76" y="32" width="36" height="36" rx="9" fill="#D8D4CE" stroke="#C5C1BB" stroke-width="1.2"/>
  <!-- Main lens -->
  <circle cx="87" cy="44" r="9" fill="#201E1C" stroke="#151310" stroke-width="0.8"/>
  <circle cx="84.5" cy="41.5" r="2.8" fill="white" opacity="0.38"/>
  <!-- Secondary lens -->
  <circle cx="100" cy="44" r="6.5" fill="#201E1C" stroke="#151310" stroke-width="0.8"/>
  <circle cx="98" cy="42" r="1.8" fill="white" opacity="0.35"/>
  <!-- Flash -->
  <rect x="88" y="57" width="9" height="5" rx="2" fill="#C5C1BB"/>
  <!-- FINGERS on back -->
  <!-- Index -->
  <ellipse cx="107" cy="130" rx="9" ry="22" fill="#F0C4A8" stroke="#D4956E" stroke-width="1.2" transform="rotate(-5 107 130)"/>
  <!-- Middle -->
  <ellipse cx="121" cy="127" rx="9" ry="24" fill="#F0C4A8" stroke="#D4956E" stroke-width="1.2" transform="rotate(3 121 127)"/>
  <!-- Ring -->
  <ellipse cx="135" cy="130" rx="8.5" ry="21" fill="#F0C4A8" stroke="#D4956E" stroke-width="1.2" transform="rotate(9 135 130)"/>
  <!-- Pinky -->
  <ellipse cx="147" cy="138" rx="7" ry="17" fill="#F0C4A8" stroke="#D4956E" stroke-width="1.2" transform="rotate(16 147 138)"/>
  <!-- Thumb -->
  <ellipse cx="83" cy="148" rx="8.5" ry="18" fill="#F0C4A8" stroke="#D4956E" stroke-width="1.2" transform="rotate(-25 83 148)"/>
  <!-- Highlight ring on camera zone -->
  <ellipse cx="110" cy="128" rx="20" ry="8" fill="rgba(224,90,58,0.12)" stroke="#E05A3A" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
